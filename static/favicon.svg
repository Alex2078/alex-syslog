<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Тёмный фон с зелёной рамкой -->
  <rect width="100" height="100" rx="16" fill="#0a0a0a" stroke="#33ff33" stroke-width="3"/>
  
  <!-- Крупные буквы SL в стиле терминала -->
  <text x="50" y="76" font-family="monospace" font-size="80" font-weight="bold" fill="#33ff33" text-anchor="middle">SL</text>
  
  <!-- Мигающий курсор -->
  <rect x="88" y="46" width="5" height="22" fill="#33ff33">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>